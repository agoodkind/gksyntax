# Pinned upstream source of the vendored tree-sitter Perl grammar in src/.
# scripts/vendor-grammars.sh reads this file and rebuilds src/ from it. Change
# a value here, run the script, and commit the rewritten src/ files with it.
repository=https://github.com/tree-sitter-perl/tree-sitter-perl.git
commit=f11fd999f9841f5cbdd1419cbad8f33c268269ce
# The upstream commit contains src/grammar.json, the external scanner, and the
# scanner's own headers, and no generated parser. The script generates
# src/parser.c and src/tree_sitter/*.h by running
# `tree-sitter generate src/grammar.json --abi <abi>` with this CLI release.
parser=generate
tree_sitter_version=0.26.9
abi=14
