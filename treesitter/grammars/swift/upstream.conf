# Pinned upstream source of the vendored tree-sitter Swift grammar in src/.
# scripts/vendor-grammars.sh reads this file and rebuilds src/ from it. Change
# a value here, run the script, and commit the rewritten src/ files with it.
repository=https://github.com/alex-pinkus/tree-sitter-swift.git
commit=24585e2020aa13c4ffe83d01810aab497afa41b3
# The upstream commit contains src/grammar.json and no generated parser. The
# script generates src/parser.c and src/tree_sitter/*.h by running
# `tree-sitter generate src/grammar.json --abi <abi>` with this CLI release.
parser=generate
tree_sitter_version=0.26.9
abi=14
