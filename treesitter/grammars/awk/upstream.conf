# Pinned upstream source of the vendored tree-sitter AWK grammar in src/.
# scripts/vendor-grammars.sh reads this file and rebuilds src/ from it. Change
# a value here, run the script, and commit the rewritten src/ files with it.
repository=https://github.com/Beaglefoot/tree-sitter-awk.git
commit=34bbdc7cce8e803096f47b625979e34c1be38127
# The upstream commit contains its generated parser. The script copies
# src/parser.c and src/tree_sitter/*.h exactly as committed there.
parser=upstream
